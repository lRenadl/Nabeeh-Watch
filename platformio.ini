; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Board: LILYGO T-Watch-S3-Plus (ESP32-S3, 16MB QSPI Flash, 8MB OPI PSRAM, 240x240 AMOLED)
;
; board/variant values below are copied verbatim from LilyGO's own PlatformIO
; reference project (Xinyuan-LilyGO/LilyGoLib-PlatformIO), not guessed:
;   - boards/lilygo-t-watch-s3.json
;   - variants/lilygo_twatch_s3/pins_arduino.h
; LilyGoLib itself only ships an Arduino-IDE library.json (no board/flash/psram
; config); this vendor repo is where those PlatformIO-specific values live.

[platformio]
boards_dir = ./boards

[env:twatchs3]
; LilyGoLib requires Arduino-ESP32 core >= 3.3.0-alpha1 (uses ESP-IDF 5.x
; esp_lcd panel APIs). The official PlatformIO "espressif32" registry platform
; is still pinned to Arduino-ESP32 2.0.17 (IDF 4.4.7) even at its newest
; release, which fails to compile LilyGoDispInterface.cpp (missing
; esp_lcd_panel_dev_config_t.rgb_ele_order / .data_endian, added in IDF 5.3+).
; The pioarduino community fork ships Arduino-ESP32 3.3.11 / IDF 5.5.5 and is
; what actually builds this library under PlatformIO today.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = lilygo-t-watch-s3
framework = arduino

upload_speed = 921600
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder

board_build.filesystem = fatfs
board_build.partitions = LilyGoLib/examples/factory/partitions.csv

build_flags =
	-D CORE_DEBUG_LEVEL=5
	-D ARDUINO_T_WATCH_S3
	-I variants/lilygo_twatch_s3
	-I include
	; Lets externally-generated LVGL font files (src/fonts_bitmap/) resolve
	; #include "lvgl.h" instead of the library-relative "lvgl/lvgl.h" path.
	-D LV_LVGL_H_INCLUDE_SIMPLE

	; Select the LoRa radio fitted on the board (see LilyGoLib hardware docs
	; for the other "Board Revision" options: SX1280 / CC1101 / LR1121 / SI4432)
	-D ARDUINO_LILYGO_LORA_SX1262

	; Trim RadioLib to the protocols LilyGoLib actually needs, to cut build time
	-D RADIOLIB_EXCLUDE_RF69
	-D RADIOLIB_EXCLUDE_SX1231
	-D RADIOLIB_EXCLUDE_RFM2X
	-D RADIOLIB_EXCLUDE_SX127X
	-D RADIOLIB_EXCLUDE_AFSK
	-D RADIOLIB_EXCLUDE_AX25
	-D RADIOLIB_EXCLUDE_HELLSCHREIBER
	-D RADIOLIB_EXCLUDE_MORSE
	-D RADIOLIB_EXCLUDE_RTTY
	-D RADIOLIB_EXCLUDE_SSTV
	-D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
	-D RADIOLIB_EXCLUDE_APRS
	-D RADIOLIB_EXCLUDE_BELL
	-Wnarrowing

lib_deps =
	symlink://LilyGoLib
	lvgl/lvgl @ ^9.4.0
	jgromes/RadioLib @ ^7.4.0
	lewisxhe/XPowersLib @ ^0.3.1
	lewisxhe/SensorLib @ ^0.3.3
	mikalhart/TinyGPSPlus @ ^1.0.3

; ---------------------------------------------------------------------------
; Full watch firmware: LVGL UI screens + the Wi-Fi/TCP channel (mic audio
; out, control/result bytes in). Its main.cpp lives in wifi_test/ instead of
; src/, so building/uploading this never touches src/main.cpp (the standalone
; mic test). Still pulls in the generated font/image .c files from
; src/fonts_bitmap/ and src/images/, which the UI needs. Companion test
; script: test-scripts/wifi_client_test.py.
;
;   pio run -e wifi_test -t upload -t monitor
;
[env:wifi_test]
extends = env:twatchs3
; `src_dir` is not a real per-environment option (PlatformIO silently ignores
; it outside the global [platformio] section) — build_src_filter is the
; actual supported way to swap in a main.cpp from outside src/.
build_src_filter = -<*> +<../wifi_test/main.cpp> +<fonts_bitmap/> +<images/>
